services:
  db:
    image: mariadb:10.11
    command:
      - --log-warnings=1
    container_name: hftoolbox-prod-db
    restart: unless-stopped
    env_file:
      - ./.env.deploy
    volumes:
      - ./db_data:/var/lib/mysql
    ports:
      - "10.50.0.10:33306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    container_name: hftoolbox-prod-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      HFT_MANIFEST_ROOT: /manifest-src
      HFT_FRONTEND_DIST_ROOT: /manifest-src/frontend/dist
      HF_CONTROL_PLANE_URL: ${HF_CONTROL_PLANE_URL:-http://hf-control-plane:8010}
      HF_CONTROL_PLANE_CALLER: ${HF_CONTROL_PLANE_CALLER:-prod}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8000", "--log-level", "info"]
    volumes:
      - ./data:/app/data
      - .:/manifest-src:ro
    ports:
      - "127.0.0.1:38000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: hftoolbox-prod-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:38080:80"
    depends_on:
      - backend
