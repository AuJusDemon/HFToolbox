server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Required for session cookies and proper request forwarding
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Disable response buffering so Set-Cookie headers reach the browser immediately
    proxy_buffering off;

    # API calls proxy to backend
    location /api/  { proxy_pass http://backend:8000; }
    location /auth/ { proxy_pass http://backend:8000; }
    location /modules/ { proxy_pass http://backend:8000; }
    location /health { proxy_pass http://backend:8000; }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
