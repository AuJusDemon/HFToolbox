server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    etag on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location ~* (^|/)(\.env|\.git|\.svn|\.hg|composer\.(json|lock)|package-lock\.json|yarn\.lock|pnpm-lock\.yaml|.*\.(log|sql|sqlite|db|bak|backup|old|orig|swp|tgz|tar|gz|zip|7z|pem|key))$ {
        return 404;
    }

    location ^~ /logs/ {
        return 404;
    }

    location ^~ /storage/ {
        return 404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
